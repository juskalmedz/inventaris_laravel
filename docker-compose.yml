version: "3.8"

# ==============================================================================
# Docker Compose - Sistem Manajemen Inventaris & Aset Kantor (Laravel 13)
# ==============================================================================
# Layanan:
#  1. app        : PHP 8.3-FPM + Composer + Artisan + Migrasi Otomatis
#  2. web        : Nginx Reverse Proxy (Akses Web di http://localhost:8000)
#  3. db         : MySQL 8.0 Database Server (Port 3306)
#  4. phpmyadmin : GUI Manajemen Database (Akses di http://localhost:8080)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Aplikasi Laravel (PHP-FPM)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventaris_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "Sistem Inventaris & Aset Kantor"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:9000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: inventaris_app
      DB_USERNAME: inventaris_user
      DB_PASSWORD: Kunci@SQL1425
      SESSION_DRIVER: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    networks:
      - inventaris_network
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. Web Server Nginx
  # ----------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: inventaris_web
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - inventaris_network
    depends_on:
      - app

  # ----------------------------------------------------------------------------
  # 3. Database MySQL 8.0
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: inventaris_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: inventaris_app
      MYSQL_USER: inventaris_user
      MYSQL_PASSWORD: Kunci@SQL1425
      MYSQL_ROOT_PASSWORD: Kunci@Root
    ports:
      - "3306:3306"
    volumes:
      - inventaris_mysql_data:/var/lib/mysql
    networks:
      - inventaris_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_secret",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. phpMyAdmin GUI (Database Explorer)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: inventaris_pma
    restart: unless-stopped
    ports:
      - "8002:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: inventaris_user
      PMA_PASSWORD: Kunci@root
      UPLOAD_LIMIT: 64M
    networks:
      - inventaris_network
    depends_on:
      - db

networks:
  inventaris_network:
    driver: bridge

volumes:
  inventaris_mysql_data:
    driver: local
